<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundeswehr Clearance Terminal</title>
    <link rel="icon" href="/favicon.ico">

    <!-- Fonts: JetBrains Mono for terminal, Roboto for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/main.css?v=clearance-3">
    <link rel="stylesheet" href="/assets/css/clearance.css?v=3">
</head>
<body class="clearance-page flex flex-col min-h-screen selection:bg-bwYellow selection:text-black">

    <!-- Header Navigation (Matches Kommando UI) -->
    <header class="clearance-header h-16 border-b border-bwBorder flex items-center justify-between px-6 bg-bwBlack z-40 shrink-0 relative">
        <div class="header-left flex items-center space-x-8">
            <div class="flex items-center space-x-3 text-bwYellow">
                <!-- SVG Shield Icon representing the logo -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="w-6 h-6 glow-text-yellow">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <h1 class="text-xl font-bold tracking-widest uppercase font-sans">Kommando</h1>
            </div>

            <div class="hidden md:flex items-center space-x-2 px-4 py-1 rounded bg-bwDark border border-bwBorder">
                <div class="w-2 h-2 rounded-full bg-bwGreen animate-pulse"></div>
                <span class="text-xs font-semibold tracking-wider text-bwGreen uppercase glow-text-green">Verbindung Stabil</span>
            </div>
        </div>

        <div class="header-actions flex items-center space-x-4">
            <a href="/" class="hidden sm:block px-4 py-1.5 text-xs font-semibold tracking-widest border border-gray-700 rounded text-gray-400 hover:text-white hover:border-gray-500 transition-colors uppercase font-sans">
                Aus Dienst
            </a>
            <div class="flex items-center space-x-2 text-gray-400 border border-bwBorder px-3 py-1.5 rounded bg-bwDark">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-bwYellow">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="clock" class="text-sm font-mono">00:00:00 UHR</span>
            </div>
        </div>
    </header>

    <!-- TERMINAL VIEW -->
    <main id="view-terminal" class="terminal-view flex-1 relative p-6 md:p-12 font-mono text-sm md:text-base flex flex-col z-10 overflow-y-auto">
        <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col">
            <!-- Terminal Output lines will be injected here -->
            <div role="log" aria-live="polite" id="terminal-output" class="space-y-2 mb-2"></div>

            <!-- Interactive Input Line (Hidden during boot) -->
            <div id="input-line" class="flex items-center text-bwYellow hidden-section">
                <span class="mr-3 font-bold">&gt;</span>
                <input type="password" aria-label="Autorisierungsschlüssel" id="cmd-input" autocomplete="off" spellcheck="false" placeholder="_" maxlength="256">
            </div>

            <!-- Spacer to push content up if needed -->
            <div class="pb-20"></div>
        </div>
    </main>

    <!-- SUCCESS VIEW (Hidden by default) -->
    <main id="view-success" class="release-view flex-1 relative p-6 md:p-12 bg-bwBlack z-10 overflow-y-auto hidden-section">
        <div class="release-shell max-w-5xl mx-auto w-full">

            <div class="release-intro flex items-center space-x-4 mb-8 fade-in" style="animation-delay: 0.2s;">
                <div class="release-lock p-3 bg-bwYellow/10 rounded-lg border border-bwYellow/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-bwYellow glow-text-yellow">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <div>
                    <h2 id="release-title" tabindex="-1" class="text-3xl md:text-5xl font-black text-bwYellow tracking-tighter uppercase font-sans">
                        Operation Neustart Deklassifiziert
                    </h2>
                    <p class="text-gray-400 mt-2 text-lg md:text-xl font-medium tracking-wide font-sans border-l-2 border-bwYellow pl-4">
                        DIE BETA-PHASE IST OFFIZIELL BEENDET. DER KOMPLETTE OVERHAUL UND DER FULL RELEASE SIND IMMINENT.
                    </p>
                </div>
            </div>

            <div class="release-grid grid grid-cols-1 gap-6 mt-12 fade-in" style="animation-delay: 0.6s;">

                <!-- Main Trailer Placeholder -->
                <div class="trailer-card group relative bg-bwDark border border-bwBorder rounded-xl overflow-hidden hover:border-bwYellow/50 transition-colors">
                    <div id="video-container" class="video-frame aspect-video bg-[#050505]"></div>
                    <div class="p-6 relative z-20 font-sans">
                        <h3 class="text-2xl font-bold text-white uppercase tracking-wider mb-2">Offizieller Trailer</h3>
                    </div>
                </div>


            </div>

            <div class="release-footer mt-12 text-center pb-12 fade-in" style="animation-delay: 1s;">
                <p class="font-mono text-sm text-gray-600 mb-4">++ BEREITHALTEN FÜR WEITERE INSTRUKTIONEN ++</p>
                <button id="disconnect-button" class="px-8 py-3 bg-transparent border border-bwBorder text-gray-400 font-bold tracking-widest uppercase font-sans rounded hover:bg-bwBorder hover:text-white transition-colors">
                    Verbindung Trennen
                </button>
            </div>

        </div>
    </main>

    <script src="/assets/js/clearance.js?v=3" defer></script>
</body>
</html>
