name: Deploy bwrpauth Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-bwrpauth.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          secrets: |
            ROBLOX_POSTER_AUTH
            SCHICHT_WEBHOOK
            SECRET_TARGET_HASH
            SECRET_VIDEO_LINK
        env:
          ROBLOX_POSTER_AUTH: ${{ secrets.ROBLOX_POSTER_AUTH }}
          SCHICHT_WEBHOOK: ${{ secrets.SCHICHT_WEBHOOK }}
          SECRET_TARGET_HASH: ${{ secrets.SECRET_TARGET_HASH }}
          SECRET_VIDEO_LINK: ${{ secrets.SECRET_VIDEO_LINK }}
