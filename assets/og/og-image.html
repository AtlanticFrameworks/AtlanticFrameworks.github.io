<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>BWRP – Open Graph Image (1200×630)</title>
    <meta name="robots" content="noindex, nofollow">

    <!--
    =====================================================================
    OG-IMAGE GENERATOR
    =====================================================================
    Quelle für /assets/images/og-image.png (Vorschaubild in Discord,
    WhatsApp, X, Google usw.).

    Neu rendern nach einer Änderung:

      "C:\Program Files\Google\Chrome\Application\chrome.exe" ^
        --headless --disable-gpu --hide-scrollbars ^
        --window-size=1200,630 --virtual-time-budget=10000 ^
        --screenshot="assets\images\og-image.png" ^
        "assets\og\og-image.html"

    Danach og-image.png committen. Die Maße 1200×630 nicht ändern –
    das ist das von allen Plattformen erwartete 1.91:1-Format.
    =====================================================================
    -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&family=Roboto+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --gold: #E2B007;
            --bg: #050505;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: var(--bg);
        }

        .canvas {
            position: relative;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        /* ── Ebene 1: Ingame-Szene, rechte Bildhälfte ──────────────── */
        .photo {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 38%;
            right: 0;
            background: url('../images/hero-bg.png') 42% 78% / cover no-repeat;
            filter: brightness(1.35) saturate(0.9) contrast(1.05);
        }

        /* ── Ebene 2: Abdunkeln nach links, damit Text trägt ────────── */
        .shade {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(100deg, #050505 34%, rgba(5, 5, 5, 0.9) 48%, rgba(5, 5, 5, 0.15) 74%, rgba(5, 5, 5, 0.45) 100%),
                linear-gradient(to top, rgba(5, 5, 5, 0.9), transparent 42%);
        }

        /* ── Ebene 3: Technik-Raster + Goldschimmer ─────────────────── */
        .grid {
            position: absolute;
            inset: 0;
            background-size: 48px 48px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        }

        .glow {
            position: absolute;
            width: 620px;
            height: 620px;
            right: -160px;
            bottom: -260px;
            background: radial-gradient(circle, rgba(226, 176, 7, 0.22), transparent 65%);
        }

        /* ── Ebene 4: Scanlines (CRT-Look der Website) ──────────────── */
        .scan {
            position: absolute;
            inset: 0;
            opacity: 0.05;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
        }

        /* ── HUD-Ecken ─────────────────────────────────────────────── */
        .corner {
            position: absolute;
            width: 46px;
            height: 46px;
            border: 3px solid var(--gold);
            opacity: 0.55;
        }

        .c-tl {
            top: 34px;
            left: 34px;
            border-right: none;
            border-bottom: none;
        }

        .c-tr {
            top: 34px;
            right: 34px;
            border-left: none;
            border-bottom: none;
        }

        .c-bl {
            bottom: 34px;
            left: 34px;
            border-right: none;
            border-top: none;
        }

        .c-br {
            bottom: 34px;
            right: 34px;
            border-left: none;
            border-top: none;
        }

        /* ── Inhalt ────────────────────────────────────────────────── */
        .content {
            position: absolute;
            inset: 0;
            padding: 62px 76px 60px;
            display: flex;
            flex-direction: column;
        }

        .middle {
            margin-top: 52px;
            margin-bottom: auto;
        }

        /* Logo-Lockup */
        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .mark {
            width: 68px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(226, 176, 7, 0.12);
            border: 2px solid rgba(226, 176, 7, 0.45);
        }

        .mark svg {
            width: 36px;
            height: 36px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand b {
            display: block;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 30px;
            letter-spacing: 0.14em;
            line-height: 1;
            color: #fff;
        }

        .brand span {
            display: block;
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.42em;
            color: var(--gold);
            margin-top: 7px;
        }

        /* Headline-Block */
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .eyebrow i {
            display: block;
            width: 46px;
            height: 3px;
            background: var(--gold);
        }

        .eyebrow span {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--gold);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 86px;
            line-height: 0.9;
            letter-spacing: -0.005em;
            text-transform: uppercase;
        }

        h1 .hollow {
            display: block;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.85);
        }

        h1 .solid {
            display: block;
            color: var(--gold);
            text-shadow: 0 0 60px rgba(226, 176, 7, 0.45);
        }

        .sub {
            margin-top: 24px;
            font-size: 23px;
            font-weight: 400;
            line-height: 1.5;
            color: #d4d4d8;
            max-width: 660px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        .sub b {
            color: #fff;
            font-weight: 600;
        }

        /* Fußzeile */
        .foot {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
        }

        .url {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: var(--gold);
            color: #000;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 30px;
            letter-spacing: 0.12em;
            padding: 13px 26px 13px 24px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
        }

        .tags {
            display: flex;
            gap: 10px;
            padding-bottom: 6px;
        }

        .tag {
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #d4d4d8;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(5, 5, 5, 0.55);
            padding: 9px 14px;
        }

        .tag.gold {
            color: var(--gold);
            border-color: rgba(226, 176, 7, 0.5);
            background: rgba(226, 176, 7, 0.08);
        }
    </style>
</head>

<body>
    <div class="canvas">
        <div class="photo"></div>
        <div class="shade"></div>
        <div class="grid"></div>
        <div class="glow"></div>
        <div class="scan"></div>

        <span class="corner c-tl"></span>
        <span class="corner c-tr"></span>
        <span class="corner c-bl"></span>
        <span class="corner c-br"></span>

        <div class="content">

            <!-- Marke -->
            <div class="brand">
                <div class="mark">
                    <!-- Lucide "shield" – inline, damit das Rendering ohne CDN funktioniert -->
                    <svg viewBox="0 0 24 24">
                        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                    </svg>
                </div>
                <div>
                    <b>BUNDESWEHR</b>
                    <span>ROLEPLAY</span>
                </div>
            </div>

            <!-- Headline -->
            <div class="middle">
                <div class="eyebrow">
                    <i></i><span>Milsim auf Roblox</span>
                </div>
                <h1>
                    <span class="hollow">Wir. Dienen.</span>
                    <span class="solid">Roblox.</span>
                </h1>
                <p class="sub">
                    Authentisches Rollenspiel. Taktische Tiefe.<br>
                    <b>Die deutsche Bundeswehr-Community auf Roblox.</b>
                </p>
            </div>

            <!-- Fußzeile -->
            <div class="foot">
                <div class="url">BWRP.NET</div>
                <div class="tags">
                    <span class="tag gold">Divisionen</span>
                    <span class="tag">Rangsystem</span>
                    <span class="tag">Einsätze</span>
                    <span class="tag">Discord</span>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
